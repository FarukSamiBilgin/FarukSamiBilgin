<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="600" viewBox="0 0 1280 600" role="img" aria-label="Notes on quantum devices by Faruk Sami Bilgin: twisted lattices, junctions and qubits."><defs>
<linearGradient id="v" x1="0" x2="1"><stop offset="0.36" stop-color="#fff" stop-opacity="0"/><stop offset="0.68" stop-color="#fff" stop-opacity="1"/></linearGradient>
<mask id="m"><rect width="1280" height="600" fill="url(#v)"/></mask>
<pattern id="a" width="12" height="20.7846" patternUnits="userSpaceOnUse" patternTransform="rotate(0 960 300)"><g fill="#e8e8e4" fill-opacity="0.5"><circle cx="0.000" cy="0.000" r="1.5"/><circle cx="12.000" cy="0.000" r="1.5"/><circle cx="0.000" cy="20.785" r="1.5"/><circle cx="12.000" cy="20.785" r="1.5"/><circle cx="6.000" cy="10.392" r="1.5"/></g></pattern>
<pattern id="b" width="12" height="20.7846" patternUnits="userSpaceOnUse" patternTransform="rotate(0 960 300)"><animateTransform attributeName="patternTransform" type="rotate" values="1.6 960 300;4.2 960 300;1.6 960 300" dur="30s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/><g fill="#e8e8e4" fill-opacity="0.5"><circle cx="0.000" cy="0.000" r="1.5"/><circle cx="12.000" cy="0.000" r="1.5"/><circle cx="0.000" cy="20.785" r="1.5"/><circle cx="12.000" cy="20.785" r="1.5"/><circle cx="6.000" cy="10.392" r="1.5"/></g></pattern>
</defs>
<rect width="1280" height="600" fill="#0a0a0a"/>
<g mask="url(#m)"><rect x="360" y="-300" width="1200" height="1200" fill="url(#a)"/><rect x="360" y="-300" width="1200" height="1200" fill="url(#b)"/></g>
<text letter-spacing="2.4" x="64.0" y="66.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#f2f2f0" text-anchor="start">FARUK SAMI BILGIN</text><text letter-spacing="2.4" x="1216.0" y="66.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#f2f2f0" text-anchor="end">NOTES ON QUANTUM DEVICES</text><line x1="0" y1="96.5" x2="1280" y2="96.5" stroke="#2a2a2a"/><text letter-spacing="-2.4" x="64.0" y="236.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="70" font-weight="600" fill="#f2f2f0" text-anchor="start">Twisted lattices,</text><text letter-spacing="-2.4" x="64.0" y="312.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="70" font-weight="600" fill="#f2f2f0" text-anchor="start">junctions and qubits</text><text x="66.0" y="372.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#9b9b96" text-anchor="start">Seven short chapters on the physics behind my work. Each has a</text><text x="66.0" y="402.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#9b9b96" text-anchor="start">figure you can change, and each ends with the full calculation</text><text x="66.0" y="432.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="21" font-weight="400" fill="#9b9b96" text-anchor="start">— code and data — in a public repository.</text><text x="66.0" y="500.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="16" font-weight="500" fill="#ff4433" text-anchor="start">faruksamibilgin.github.io  →</text><text x="66.0" y="560.0" font-family="'IBM Plex Sans', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#5f5f5b" text-anchor="start">Header: two triangular lattices twisting between 1.6° and 4.2°; moiré period L = a / 2 sin(θ/2).</text></svg>