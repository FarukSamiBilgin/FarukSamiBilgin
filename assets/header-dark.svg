<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="Faruk Sami Bilgin, independent researcher in quantum devices">
<defs>
  <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0.40" stop-color="#fff" stop-opacity="0"/><stop offset="0.66" stop-color="#fff" stop-opacity="1"/></linearGradient>
  <mask id="m"><rect width="1280" height="400" fill="url(#fade)"/></mask>
  <clipPath id="c"><rect x="0.5" y="0.5" width="1279" height="399" rx="12"/></clipPath>
  <pattern id="la" width="12" height="20.7846" patternUnits="userSpaceOnUse" patternTransform="rotate(0 960 200)"><g fill="#c9d3df" fill-opacity="0.42"><circle cx="0.000" cy="0.000" r="1.55"/><circle cx="12.000" cy="0.000" r="1.55"/><circle cx="0.000" cy="20.785" r="1.55"/><circle cx="12.000" cy="20.785" r="1.55"/><circle cx="6.000" cy="10.392" r="1.55"/></g></pattern>
  <pattern id="lb" width="12" height="20.7846" patternUnits="userSpaceOnUse" patternTransform="rotate(0 960 200)"><animateTransform attributeName="patternTransform" type="rotate" values="1.5 960 200;4.0 960 200;1.5 960 200" dur="30s" repeatCount="indefinite" calcMode="spline" keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/><g fill="#c9d3df" fill-opacity="0.42"><circle cx="0.000" cy="0.000" r="1.55"/><circle cx="12.000" cy="0.000" r="1.55"/><circle cx="0.000" cy="20.785" r="1.55"/><circle cx="12.000" cy="20.785" r="1.55"/><circle cx="6.000" cy="10.392" r="1.55"/></g></pattern>
</defs>
<g clip-path="url(#c)">
  <rect width="1280" height="400" fill="#0b0e13"/>
  <g mask="url(#m)">
    <rect x="380" y="-240" width="1140" height="880" fill="url(#la)"/>
    <rect x="380" y="-240" width="1140" height="880" fill="url(#lb)"/>
  </g>
</g>
<rect x="0.5" y="0.5" width="1279" height="399" rx="12" fill="none" stroke="#1d232c"/>
<text x="64" y="132" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="52" font-weight="600" fill="#e9edf2" letter-spacing="-0.8">Faruk Sami Bilgin</text>
<text x="66" y="174" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#8b95a3">Independent researcher in quantum devices</text>
<text x="66" y="202" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="19" fill="#8b95a3">Josephson and moiré qubits, graphene quantum dots, quantum networks</text>
<line x1="66" x2="126" y1="262" y2="262" stroke="#1d232c" stroke-width="1"/>
<g transform="translate(66,296)"><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.0000;0.0300;0.2200;0.2500;1" dur="18.0s" repeatCount="indefinite"/><text x="0" y="0" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#8b95a3">Twisted hBN, registry-resolved DFT</text><text x="0" y="26" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Consolas, Menlo, monospace" font-size="19" fill="#d9a441">V<tspan dy='4' font-size='12'>0</tspan><tspan dy='-4'> = 40 meV</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.2500;0.2800;0.4700;0.5000;1" dur="18.0s" repeatCount="indefinite"/><text x="0" y="0" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#8b95a3">Orbital qubit in twisted hBN</text><text x="0" y="26" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Consolas, Menlo, monospace" font-size="19" fill="#d9a441">T<tspan dy='4' font-size='12'>1</tspan><tspan dy='-4'> ≈ 6–11 ps</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.5000;0.5300;0.7200;0.7500;1" dur="18.0s" repeatCount="indefinite"/><text x="0" y="0" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#8b95a3">Magic-angle graphene junction</text><text x="0" y="26" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Consolas, Menlo, monospace" font-size="19" fill="#d9a441">half-step width 0.200 I<tspan dy='4' font-size='12'>c</tspan></text></g><g opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0;0.7500;0.7800;0.9700;1.0000;1" dur="18.0s" repeatCount="indefinite"/><text x="0" y="0" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="14" fill="#8b95a3">Repeater chain, 400 km</text><text x="0" y="26" font-family="ui-monospace, 'SFMono-Regular', 'Cascadia Mono', Consolas, Menlo, monospace" font-size="19" fill="#d9a441">1.94 Hz with optimal cutoff</text></g></g>
<text x="1244" y="370" text-anchor="end" font-family="-apple-system, 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="12" fill="#566170">Two triangular lattices, twist 1.5°–4.0° · moiré period L = a / 2 sin(θ/2)</text>
</svg>